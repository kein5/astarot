# Development tool versions and routine tasks (https://mise.jdx.dev/).
#
# This file is the one place the toolchain versions are pinned, for developers and for CI
# (jdx/mise-action). There is no rust-toolchain.toml or .nvmrc. Python packages, npm packages
# and crates stay pinned in uv.lock, package-lock.json and the Cargo.lock files.
# docs/development.md explains the tasks; `mise tasks` lists them.
min_version = "2026.11.0"

[tools]
node = "26.13.1"
# Installed through rustup. Cargo.toml's rust-version (1.92) is the oldest that builds;
# this is the version development and CI use.
rust = { version = "1.100.0", profile = "minimal", components = "clippy,rustfmt" }
# The one place the Python version is set: the build tools and the tests (the packages carry no
# Python since 0.5.0, and the Python backend went in 0.6.0).
# pyproject.toml's requires-python names the same minor version (tests/devtools/test_toolchain_pins.py),
# and uv takes this interpreter from PATH instead of choosing a version of its own.
python = "3.14.10"
uv = "0.13.5"
cocogitto = "7.0.0"
# Lints and formats the UI's TypeScript and JavaScript (biome.json; `python tools/dev.py check --scope ui`).
biome = "2.6.6"
# Checks of the repository itself. Each takes the newest release that had been out for two weeks
# when it was added (2026-11-21; docs/development.md); CI installs only the ones a job runs
# (install_args).
# The workflows: actionlint for syntax and expressions, zizmor for security problems.
actionlint = "1.7.12"
zizmor = "1.32.0"
# The Rust crates: cargo-deny for licenses, advisories and sources; cargo-nextest runs the tests.
# mise's registry has no cargo-nextest, so it comes from its GitHub releases (see [tool_alias]).
cargo-deny = "0.20.2"
cargo-nextest = { version = "0.9.151", version_prefix = "cargo-nextest-" }
# Secrets in the history and known vulnerabilities in the lock files.
gitleaks = "8.30.1"
osv-scanner = "2.7.0"
# Links in the documents and the user guide.
lychee = "0.24.2"
# Git hooks.
hk = "2.11.1"
# Structural search and rewrite for migrations (ast-grep), and the software bill of materials of
# a release (syft). Pinned for those tasks; no check runs them.
ast-grep = "0.51.1"
syft = "1.57.0"

[tool_alias]
cargo-nextest = "github:nextest-rs/nextest"

# No uv settings in [env]: mise exports [env] to every program it starts. Tasks that create
# environments set them for themselves instead.
[env]
# ONNX Runtime otherwise writes a device id under ~/.cache/Microsoft and sends usage events from
# every tool and test that creates a session (#574): the Rust tests that load it, and the Python
# environments of the translation export and the RVC reference. Exported to everything mise starts
# on purpose; the app's own ONNX Runtime sets this itself.
ORT_DISABLE_TELEMETRY = "1"

# Every task forwards extra arguments to its command, e.g. `mise run check -- --dry-run`.
# The shortcuts to tools/dev.py live here only; package.json keeps the scripts that need npm
# (tests/devtools/test_dev_shortcuts.py).

[tasks.doctor]
description = "Show missing tools and dependencies (no downloads)"
run = "python tools/dev.py doctor"

[tasks.check]
description = "Quick checks: developer tools, UI tests (Vitest) and Ruff"
run = "python tools/dev.py check"

[tasks."check:all"]
description = "Every check scope (slow; before merging work that spans areas)"
run = "python tools/dev.py check --scope all"

[tasks."check:voice"]
description = "Voice contract tests without models"
run = "python tools/dev.py check --scope voice"

[tasks."check:ui"]
description = "UI tests (Vitest), Biome (lint and format check), the type check and the Vite build"
run = "python tools/dev.py check --scope ui"

[tasks."check:rust"]
description = "cargo check of the Tauri app, and the native crates' tests (cargo-nextest and doctests)"
run = "python tools/dev.py check --scope rust"

[tasks."check:integration"]
description = "Integration tests: the screens in Chromium and WebKit through the real core (Playwright)"
run = "python tools/dev.py check --scope integration"

[tasks."check:workflows"]
description = "Workflows and the repository's own actions (actionlint, zizmor)"
run = "python tools/dev.py check --scope workflows"

[tasks."check:crates"]
description = "Licenses and sources of every Cargo workspace's dependencies (cargo-deny; setup:rust first)"
run = "python tools/dev.py check --scope crates"

[tasks."check:vulns"]
description = "Known vulnerabilities of every lock file (osv-scanner; asks osv.dev)"
run = "python tools/dev.py check --scope vulns"

[tasks."check:secrets"]
description = "Keys and tokens in the commits since origin/develop (gitleaks; fetch it first)"
run = "python tools/dev.py check --scope secrets --base origin/develop"

[tasks."check:commits"]
description = "Commit messages since origin/develop (fetch it first)"
run = "python tools/dev.py check --scope commits --base origin/develop"

[tasks."setup:headless"]
description = "Python packages for the model-free tests (build/dev/headless-venv)"
run = "python tools/dev.py setup --scope headless"
env = { UV_PYTHON_PREFERENCE = "only-system" }

[tasks."setup:ui"]
description = "npm ci for the UI"
run = "python tools/dev.py setup --scope ui"

[tasks."setup:browser"]
description = "Python packages for the browser tests (build/dev/browser-venv)"
run = "python tools/dev.py setup --scope browser"
env = { UV_PYTHON_PREFERENCE = "only-system" }

[tasks."setup:rust"]
description = "cargo fetch --locked for the Tauri app and the native crates"
run = "python tools/dev.py setup --scope rust"

[tasks."setup:integration"]
description = "The core host's Rust dependencies and Playwright's Chromium and WebKit (several hundred MB)"
run = "python tools/dev.py setup --scope integration"

[tasks."setup:resources"]
description = "src-tauri/bin/_internal for tauri dev and cargo check (stages what build/ has)"
run = "python tools/dev.py setup --scope resources"

[tasks.spec]
description = "Regenerate the spec reference (docs/spec/reference/): the core's catalog, then the tables"
env = { VRCT_SPEC_CATALOG_WRITE = "1" }
run = "cargo test --locked --manifest-path native/core/Cargo.toml --test spec_catalog && python tools/spec_catalog.py --write"

[tasks.adr]
description = "Regenerate the ADR index table (docs/adr/README.md) from the front matter"
run = "python tools/adr_catalog.py --write"

[tasks."build:voice-gate"]
description = "Linux audio helpers in build/ (needs the PipeWire development files)"
run = "python tools/build_voice_gate.py"

[tasks."build:rvc-worker"]
description = "RVC worker in build/ (downloads nothing)"
run = "python tools/build_rvc_worker.py"

[tasks."build:windows"]
description = "Windows app build (npm run build: stops a running app and cleans first)"
run = "npm run build"

[tasks."build:linux"]
description = "Linux candidate build (tools/build_linux.py; see docs/voice-stack/linux-build-pipeline.md)"
run = "python tools/build_linux.py"

[tasks."changelog:print"]
description = "Show the next release's changes without writing anything"
run = "python tools/changelog.py print"

[tasks."changelog:notes"]
description = "Start docs/release-notes/<version>.md for a stable release (never overwrites)"
run = "python tools/changelog.py scaffold-notes"

[tasks."dev:web"]
description = "Web UI development server (Vite)"
run = "npm run dev:web"
