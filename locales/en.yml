            release_channel:
                label: "Update channel"
                desc: "Which versions the in-app update gets. Stable gets only stable releases; Beta gets beta releases too. Beta releases let you try new features first, but may still have bugs. Going back from Beta to Stable does not install an older version: the app updates when the next stable release is out. A feature on trial."
