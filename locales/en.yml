    notice_irodori_large: "Large Japanese TTS for speech.cpp 0.10.0 or later. Its text encoder comes from Google's Gemma, so the Gemma Terms of Use and the Gemma Prohibited Use Policy apply. The codec is MIT, with an Apache-2.0 base. The provider prohibits impersonation without consent and misleading synthetic speech. It uses about 4 GiB of GPU memory and takes a few seconds to its first audio. Review the model card and the terms."
    notice_qwen: "Multilingual TTS with nine preset speakers for speech.cpp 0.9.0. Apache-2.0. Use the model and generated speech responsibly and respect the rights of others."
    notice_rvc: "RVC v2 voice conversion, trained on the author's own voice according to the model card. CC BY 4.0 requires attribution: Voice model created by Saisho Utane — https://huggingface.co/Saisho-Utane — Used under the CC BY 4.0 license. Include credit in public content and project documentation, link the license, and indicate changes. Voice quality in this runtime has not yet been verified."
    notice_ppocr: "Text detection and recognition for Chat reading from PaddleOCR (PaddlePaddle), Apache-2.0. Runs on your PC's CPU; screen contents are never uploaded."
    notice_chatbox: "ASTAROT's own chatbox detector for Chat reading (YOLOX-Tiny), trained on ASTAROT's own screenshots and published under MIT. Runs on your PC's CPU; screen contents are never uploaded."
    notice_translation: "A local translation model for ONNX Runtime, converted from the model named above. It runs on your PC; the text you translate is never uploaded. Check the license of the original model."
    # NLLB-200 distilled 600M (the notice of its translation_models.json entry); the memory was measured with that version.
    notice_translation_nllb_600m: "A local translation model for ONNX Runtime, converted from NLLB-200 distilled 600M. It runs on your PC; the text you translate is never uploaded. Translating uses about 1.4 GiB of memory. The default model stays M2M100; this model is used only when you choose it."
    notice_translation_nllb_1_3b: "A local translation model for ONNX Runtime, converted from NLLB-200 distilled 1.3B. It runs on your PC; the text you translate is never uploaded. Translating uses about 2.6 GiB of memory. The default model stays M2M100; this model is used only when you choose it."
    notice_haas: "Japanese speech recognition with punctuation for speech.cpp 0.9.4 or later. Apache-2.0, by Third Intelligence, converted by sakasegawa. Review the model card before use."
    rvc_requirements: "This downloads only the RVC voice model and index. Conversion also needs the RVC runtime (Python environment, HuBERT and RMVPE). Download completion does not mean conversion is ready."
    notice_qwen_asr: "Speech recognition in 30 languages that detects the spoken language itself. Apache-2.0, by the Qwen team, converted by sakasegawa. 1.7B makes fewer mistakes than 0.6B (CER 9.49% against 11.89% on Common Voice Japanese in speech.cpp's measurement) but needs more space and memory. Review the model card before use."
    notice_reazonspeech: "Japanese-only speech recognition that writes punctuation. Apache-2.0, by Reazon Research, trained on the ReazonSpeech v2.0 corpus and converted by sakasegawa. Review the model card before use."
    notice_parakeet_ja: "Japanese-only speech recognition that writes punctuation. CC BY 4.0, by NVIDIA, converted by sakasegawa. If you share the model itself, credit NVIDIA and link the license. Review the model card before use."
    notice_parakeet_v3: "Speech recognition in 25 European languages that detects the spoken language itself. It does not recognize Japanese. CC BY 4.0, by NVIDIA, converted by sakasegawa. If you share the model itself, credit NVIDIA and link the license. Review the model card before use."
    notice_nemotron_asr: "A large multilingual recognizer (30B parameters, 4B active). Even its smallest file is about 19 GB (17.7 GiB), and the whole file must fit in GPU and system memory together. Next to VRChat it needs a PC with a lot of spare memory. OpenMDW-1.1, by NVIDIA, converted by sakasegawa. Review the model card and the license before use."
