                    unknown: "Monitor chosen before (the monitor list cannot be read)"
            talk_ai:
                label: "Talk AI"
                lead: "Settings gain a \"Talk AI\" page. Your voice and screen are sent only once you start a conversation there and agree."
                desc: "Talk with an AI by voice while showing it your screen. The AI is an outside service: you need an OpenAI Realtime API key or a vLLM-Omni server you run yourself. This feature is still being tested."
