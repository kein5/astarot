  vocabulary_list_help: "The dictionary holds the built-in VRChat terms and the terms you added. Add terms with the fields above the list. You can change the readings of a built-in term or take it out. Your changes are saved with your settings and stay after the app is updated. Built-in terms you have not changed follow an update when it adds terms or corrects readings. Your terms and the built-in terms whose readings you changed can be 100 in all."
