        notice: "These features are still being tried out. Each one is off until you turn it on here, and only the ones you turn on run. They may change or go away in a later version. If something goes wrong, turn the feature off again."
        empty: "There are no features to try right now. New ones will appear here when they are added."
        section_label: "Features to try"
        # One entry per feature in src-ui/logics/configs/experimentalFeatures.ts:
        # <id>: { label: "...", desc: "What it does. Experimental: ..." }
        items:
            tray_companion:
                label: "Hexagram overlay"
                lead: "From the next start the app opens in the tray without its main window."
                desc: "Use ASTAROT through a hexagram hidden at the edge of the screen and the desktop captions. Bring the mouse to the edge and half of the hexagram comes out. Turn it with the wheel, hover a triangle, and press the label that comes out to switch that feature. This feature is still being tested."
