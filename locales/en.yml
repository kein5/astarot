  scope: "Captions appear in the message log and the large overlay when enabled. Captions stay off after restart. The main screen's microphone and speaker switches start and stop these captions. On Windows the switches use them only while \"Local (speech.cpp)\" is the speech recognition engine; with other engines the switches use the classic recorder and these captions run from the Start button below. Starting captions stops the level meter for that input."
  server_help: "Connect to a local speech.cpp server with an ASR model and Silero VAD already loaded."
  start_server: "Start the bundled ASR server when a switch is turned on"
  start_server_help: "When this is off, the bundled ASR server starts only from the Start button under \"Models and servers\". Turning a switch on while it is stopped then tells you to start it."
  url: "ASR server URL"
  model: "ASR model"
  select_model: "Select an ASR model"
  unavailable: "Unavailable"
  refresh_models: "Refresh ASR models"
  refresh_devices: "Refresh audio devices"
  mic: "Microphone captions"
  speaker: "Game audio captions"
  mic_input: "Microphone input"
  speaker_input: "Game audio output"
  mic_language: "Microphone language"
  speaker_language: "Game audio language"
  select_device: "Select a device"
  disconnected: "Disconnected — select the device again"
  speaker_help: "Select an output dedicated to the game. A shared output also includes other apps. Game audio is never sent to your microphone or OSC chatbox."
  start_mic: "Start microphone captions"
  stop_mic: "Stop microphone captions"
  start_speaker: "Start game audio captions"
  stop_speaker: "Stop game audio captions"
  state_unknown: "Checking caption status"
  state_idle: "Captions stopped"
  state_starting: "Starting captions"
  state_ready: "Captions running"
  state_stopping: "Stopping captions"
  state_closed: "Captions stopped"
  state_failed: "Captions stopped after an error"
  save_help: "Save changes before starting. Changing an input stops its captions; changing the server or model stops both inputs."
  save: "Save caption settings"
  auto_language: "Detect automatically (auto)"
  auto_help: "Automatic detection needs a model that detects the language, such as Qwen3-ASR. The bundled ASR server loads one model for both inputs, so choose Qwen3-ASR if other players speak languages other than Japanese."
  follow_default_mic: "Follow the system default input"
  follow_default_speaker: "Follow the system default output"
  follow_default_help: "The system default is read when captions start and kept until they stop. ASTAROT's own virtual devices, and a virtual cable set as the default microphone, are never captured."
  vocabulary: "Term dictionary"
  vocabulary_help: "Terms the recognizer should hear and write as given. Haas-ja takes them as keywords; Qwen3-ASR gets a short hint of them. Write one term per entry, optionally with readings after \"=\" separated by commas, such as VRChat=ブイアールチャット,ブイチャ. List only terms you need: each one adds a small chance of a word that was not said. Changing the dictionary stops running captions."
  vocabulary_builtin: "Use the built-in VRChat terms"
  vocabulary_user: "Your terms"
  vocabulary_term: "Term to add"
  vocabulary_add: "Add term"
  vocabulary_remove: "Remove {{term}}"
  vocabulary_remove_short: "Remove"

realtime_toggle:
  save_unconfirmed: "The save could not be confirmed. Check the settings and try saving again."
  realtime_request_failed: "The realtime recognition request could not be finished. Check its state, then try again."
  backend_unavailable: "Cannot reach the ASTAROT engine."
  generic: "Realtime recognition could not start or has stopped ({{reason}}). Check Settings → Speech recognition (ASR) → Realtime captions."
  realtime_endpoint_required: "No input is selected. In Settings → Speech recognition (ASR) → Realtime captions, choose a device or the system default, save, and turn this on again."
  realtime_default_endpoint_missing: "The system default device was not found. Connect a device, or choose one in Settings → Speech recognition (ASR) → Realtime captions, then turn this on again."
  realtime_default_endpoint_feedback: "The system default is a virtual device, which would capture ASTAROT's own speech. Choose your real device in Settings → Speech recognition (ASR) → Realtime captions or change the system default, then turn this on again."
  asr_capture_stream_create_failed: "The microphone could not be opened. Check that no other app holds it. On Windows, also check that ASTAROT is allowed under Settings → Privacy & security → Microphone. Leaving Windows' permission question unanswered counts as a refusal."
  asr_capture_start_timeout: "No audio arrived from the microphone. If Windows is asking for permission, allow it and start again. Otherwise check the device, and Settings → Privacy & security → Microphone."
  realtime_endpoint_feedback: "The chosen device carries what ASTAROT sends to its voice output, so it would caption your own voice. Choose another device in Settings → Speech recognition (ASR) → Realtime captions."
  realtime_asr_model_missing: "The bundled ASR server has no recognition model. In Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, download and apply Qwen3-ASR (30 languages) or Haas-ja (Japanese), then turn this on again."
  realtime_vad_model_missing: "The bundled ASR server has no VAD model. In Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, download and apply Silero VAD, then turn this on again."
  speech_server_model_invalid: "A model file of the bundled ASR server is missing or is not a GGUF file. Check the model and VAD paths in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD."
  speech_server_busy: "The ASR server is still stopping. Wait a moment, then turn this on again."
  speech_server_start_failed: "The bundled ASR server could not start. Check its model files and inference device in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, then turn this on again."
  speech_server_exited: "The bundled ASR server stopped unexpectedly. Check its model files and inference device in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, then turn this on again."
  realtime_platform_unsupported: "Realtime captions are not available on this system."
  speech_server_vulkan_missing: "The GPU driver's Vulkan library (vulkan-1.dll) was not found. Install or update your GPU driver, then turn this on again."
  speech_server_device_failed: "The selected inference device could not run the model. Update your GPU driver, or choose another inference device or CPU in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, save, and turn this on again."
  speech_server_out_of_memory: "Not enough memory to load the ASR model. Stop other GPU applications or select CPU in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, save, and turn this on again."
  speech_server_start_timeout: "The ASR model took too long to load. Choose another inference device in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, then turn this on again."
  speech_server_not_ready: "The ASR server is not running. Start it in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, or select the bundled server in Settings → Speech recognition (ASR) → Realtime captions, then turn this on again."
  speech_server_autostart_off: "The bundled ASR server is stopped. Start it in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD, or turn on \"Start the bundled ASR server when a switch is turned on\" under Realtime captions and save, then turn this on again."
  realtime_models_unavailable: "The ASR server did not answer. If you use an external server, make sure it is running and that its URL in Settings → Speech recognition (ASR) → Realtime captions is correct."
  realtime_model_required: "No ASR model is selected. In Settings → Speech recognition (ASR) → Realtime captions, select one and save."
  realtime_model_unavailable: "The selected ASR model is not loaded on the server. In Settings → Speech recognition (ASR) → Realtime captions, refresh the models, select an available one, and save."
  realtime_language_unsupported: "The ASR model does not recognize the selected language. Choose a language it lists in Settings → Speech recognition (ASR) → Realtime captions."
  realtime_language_auto_unsupported: "This ASR model cannot detect the language. In Settings → Speech recognition (ASR) → Realtime captions, choose the language that is spoken, or download Qwen3-ASR for automatic detection."
  realtime_capture_failed: "Audio capture stopped. The device may have been unplugged or changed; check it and turn this on again."
  realtime_asr_timeout: "The speech recognition server did not return a result in time. Turn this on again. If it keeps happening, close other GPU apps or choose another inference device in Settings → Speech recognition (ASR) → Models and servers → ASR + VAD."

speech_servers:
    setup_title: "Models and servers"
    model_set: "Model set"
    model_unset: "No model set"
    title: "Bundled speech.cpp servers"
    help: "Choose existing GGUF files you have permission to use. Saving does not load models; start each server when needed. ASR needs a VAD model. An optional voice file is registered as custom. Stopping a TTS server clears the shared speech queue; stopping ASR ends its captions. Servers stay off after restarting the app."
    japanese: "Japanese TTS"
    multilingual: "Multilingual TTS"
    asr: "ASR + VAD"
    model: "Model GGUF path"
    vad_model: "VAD GGUF path"
    diarization_model: "Diarization GGUF path (optional)"
    diarization_help: "With a file here, game audio captions carry a label for each voice (A, B, …). The labels are guessed from the sound of the voices: they do not name anyone, and similar voices can share one. Captions arrive a little later. Leave it empty for captions without speakers. It needs a GPU: while the server runs on the CPU, captions carry no speakers even with the model."
    voice_file: "Voice GGUF path (optional)"
    device: "Inference device"
    device_named: "{{label}} ({{name}})"
    device_missing: "{{name}} (not found)"
    device_integrated: "{{label}} ({{name}}): integrated graphics can't be used"
    device_help: "You can choose the CPU or a dedicated GPU; integrated graphics are not used. Auto and GPU use a dedicated GPU, and of several the one with the most memory. Without a dedicated GPU, Auto runs on the CPU. This works the same for AMD, Intel and NVIDIA. Running this on the GPU that RVC uses can make RVC stop more easily."
    cpu_build_separate: "CPU runs a CPU-only build of speech.cpp that needs no Vulkan. Auto also uses it when no GPU can be used."
    cpu_build_shared: "CPU runs the same speech.cpp on the processor. It still needs the Vulkan library of your GPU driver (vulkan-1.dll)."
    gpu_build_unavailable: "The GPU build of speech.cpp does not start. The Vulkan loader (libvulkan.so.1) may be missing. Auto and CPU still work on the CPU build. To use a GPU, install the Vulkan loader package (libvulkan1 or vulkan-loader) and your GPU's Vulkan driver, then open this page again."
    low_latency: "Low-latency standby (Irodori GPU)"
    low_latency_help: "While the server runs, it keeps the GPU warm with silent requests, even with TTS off, so the first speech starts sooner. Uses more power and may compete with games. Stop the server before changing this. Latency is not guaranteed."
    low_latency_warming: "Preparing low-latency standby"
    low_latency_ready: "Low-latency standby active"
    low_latency_failed: "Low-latency standby stopped after an error; normal TTS remains available. Restart this server to retry."
    low_latency_stopped: "Low-latency standby stopped"
    auto: "Automatic"
    cpu: "CPU"
    gpu: "GPU"
    start: "Start server"
    stop: "Stop server"
    save: "Save server settings"
    reload: "Reload server settings"
    state_stopped: "Stopped"
    state_preparing: "Loading model"
    state_ready: "Ready"
    state_stopping: "Stopping"
