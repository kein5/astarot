                    label: "Screen edge for the hexagram"
                    desc: "Bring the mouse to the middle of this edge and the hexagram comes out."
                    right: "Right"
                    left: "Left"
                    top: "Top"
                    bottom: "Bottom"
                monitor:
                    label: "Monitor for the hexagram"
