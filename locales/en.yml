  speaker: "Listening captions"
  mic_input: "Microphone input"
  speaker_input: "Listening output"
  mic_language: "Microphone language"
  speaker_language: "Listening language"
  select_device: "Select a device"
  disconnected: "Disconnected — select the device again"
  speaker_help: "Select an output dedicated to the game. A shared output also includes other apps. What Listening hears is never sent to your microphone or OSC chatbox."
  start_mic: "Start microphone captions"
  stop_mic: "Stop microphone captions"
  start_speaker: "Start Listening captions"
  stop_speaker: "Stop Listening captions"
  state_unknown: "Checking caption status"
  state_idle: "Captions stopped"
  state_starting: "Starting captions"
  state_ready: "Captions running"
  state_stopping: "Stopping captions"
  state_closed: "Captions stopped"
  state_failed: "Captions stopped after an error"
  save_help: "Changing an input stops its captions; changing the server or model stops both inputs."
  auto_language: "Detect automatically (auto)"
  auto_help: "Automatic detection needs a model that detects the language, such as Qwen3-ASR. The bundled ASR server loads one model for both inputs, so choose Qwen3-ASR if other players speak languages other than Japanese."
  follow_default_mic: "Follow the system default input"
  follow_default_speaker: "Follow the system default output"
  follow_default_help: "The system default is read when captions start and kept until they stop. ASTAROT's own virtual devices, and a virtual cable set as the default microphone, are never captured."
  silence: "Silence that ends an utterance"
  silence_default: "Default (0.4 s)"
  silence_seconds: "{{seconds}} s"
  silence_help: "After this much silence the utterance is final and goes on to translation, the chatbox and speech. A shorter silence gives results sooner, but a pause inside a sentence is more likely to end it, so one sentence may become several messages. Changing it stops both captions."
  vad_threshold: "Speech detection threshold"
  vad_threshold_default: "Default (the server's own)"
  vad_threshold_help: "How sure the detection must be that it hears speech. Lower picks up quiet speech and soft starts, but more noise is taken for speech. Higher lets less noise through, but may drop quiet speech. Raise it in a noisy place, lower it if your voice is quiet. Changing it stops both captions."
  vocabulary: "Term dictionary"
  vocabulary_help: "Keeps how terms are written and read the same in speech recognition, speech and translation. Recognized text from any engine gets the written form you registered. Japanese speech reads a term with its first reading. AI translators are told which of your terms a text holds, as names. Write one term per entry, optionally with readings after \"=\" separated by commas, such as VRChat=ブイアールチャット,ブイチャ. A reading that is also an everyday word changes that word too. Haas-ja takes the terms as keywords; Qwen3-ASR gets a short hint of them. List only terms you need: each one adds a small chance of a word that was not said. Changing the dictionary stops running captions."
  vocabulary_builtin: "Use the built-in VRChat terms"
  vocabulary_user: "Your terms"
  vocabulary_add: "Add term"
  vocabulary_remove: "Remove {{term}}"
  vocabulary_remove_short: "Remove"
  # #792: the dictionary in use, one list: the user's own terms and the built-in terms with the
  # user's changes. Terms are added at its head. A built-in term left as it ships follows a newer
  # app's list.
  vocabulary_list_one: "Terms in the dictionary ({{count}})"
  vocabulary_list_other: "Terms in the dictionary ({{count}})"
  vocabulary_list_about: "How the dictionary is built"
  vocabulary_new_written: "Written form"
