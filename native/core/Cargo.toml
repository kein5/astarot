[package]
name = "astarot-core"
version = "0.0.0"
description = "The ASTAROT backend core: the UI request protocol, settings and their migration, start-up and shut-down (codename Ayperos)"
edition = "2024"
publish = false

[lib]
name = "astarot_core"

[features]
default = ["onnx-translation"]
# Linux: list and watch the PipeWire devices (links libpipewire-0.3; building needs its
# development files and libclang). No effect on Windows.
pipewire = ["astarot-audio-routing/pipewire", "astarot-transcription/pipewire"]
# Local translation with ONNX Runtime (native/translate-onnx), loaded at run time like chat
# reading's (docs/voice-stack/core-integration.md, decisions 1 and 2). Nothing is linked or
# fetched at build time. Without the feature the local translation reports its model as missing.
onnx-translation = ["dep:astarot-translate-onnx"]

[dependencies]
astarot-talk-ai = { path = "../talk-ai" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
# The names the app goes by outside its code (ADR-014): the saved keys, the package folder.
astarot-app-identity = { path = "../app-identity" }
base64 = "=0.22.1"
getrandom = "=0.3.4"
# Local times in file names and the conversation log (src/local_time.rs). The newest release that
# had been out for 14 days (2026-11-21, #879; docs/development.md); chrono is unmaintained.
jiff = "=0.2.39"
serde = { version = "=1.0.229", features = ["derive"] }
# The backend answered with Python dicts, whose keys keep their order; the UI shows some of
# them in that order (the translation weights, the initialization snapshot). See README.md.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# Chat reading. ONNX Runtime is loaded when chat reading starts, not linked: see
# docs/voice-stack/core-integration.md, item 2 of "判断が要ること".
astarot-ocr-runtime = { path = "../ocr-runtime", default-features = false, features = ["load-dynamic"] }
# The one ONNX Runtime library and environment of the process, which chat reading and the local
# translation share (shipped_libraries.rs points it at the library the packages ship).
astarot-onnx-runtime = { path = "../onnx-runtime", default-features = false, features = ["load-dynamic"] }
astarot-adapters = { path = "../adapters" }
# The audio devices. Without the `pipewire` feature below, Linux lists no devices: the tests
# build that way and need no PipeWire; the application turns it on.
astarot-audio-routing = { path = "../audio-routing", default-features = false }
# The OpenVR client library the packages ship (shipped_libraries.rs); the overlay depends on it too.
astarot-openvr-client = { path = "../openvr-client" }
astarot-ops = { path = "../ops" }
astarot-speech-server = { path = "../speech-server" }
# Speech recognition: the recorder, the cloud engines and realtime recognition on speech.cpp.
astarot-transcription = { path = "../transcription" }
# The local translation on ONNX Runtime; see the onnx-translation feature below.
astarot-translate-onnx = { path = "../translate-onnx", optional = true, default-features = false, features = ["load-dynamic"] }
astarot-translation = { path = "../translation", features = ["sudachi"] }
astarot-tts = { path = "../tts" }
# Direct voice, the RVC worker's owner and its runtime setup.
astarot-voice-conversion = { path = "../voice-conversion" }
astarot-vr-overlay = { path = "../vr-overlay" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# The API keys in the Secret Service (src/config/secrets/secret_service.rs). The same version the
# application already locks for its portals; pure Rust, no libdbus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    # The API keys in the Credential Manager (src/config/secrets/credential_manager.rs).
    "Win32_Security_Credentials",
    # DPAPI for the API keys' file that keys move from (src/config/secrets.rs).
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }
# The GPU memory of the flow panel (src/gpu_memory/windows.rs): DXGI's adapters, the performance
# counters and the process list. The same version the VR overlay already builds.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
] }

# GetSystemTimes for the CPU usage examples/pipeline_latency.rs records on Windows
# (tests/machine_load.rs). A dev-dependency, so the application's build gains nothing.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# Property-based tests of the pure parts (#550): the normalizers of the saved settings.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# Certificates for the WebSocket TLS settings are made at test time; no key is committed.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem"] }
tempfile = "=3.27.0"
# A stand-in speech.cpp Realtime server for tests/realtime_asr.rs.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# A stand-in for every translation provider on a loopback port.
astarot-translation = { path = "../translation", features = ["fake-server"] }

# A stand-in for the speech.cpp executable that tests/speech_servers.rs starts. It is never
# part of an application build: a dependent crate does not build this target.
[[bin]]
name = "fake-speech-core"
path = "tests/fixture/fake_speech.rs"
test = false
doc = false

# A stand-in for the RVC worker that tests/voice.rs starts (the same pipe contract, no model).
# Never part of an application build.
[[bin]]
name = "fake-rvc-worker"
path = "tests/fixture/fake_rvc_worker.rs"
test = false
doc = false

# A stand-in for llama.cpp's llama-server that tests/translation_llama.rs starts: the same file
# as astarot-speech-server's. Never part of an application build.
[[bin]]
name = "fake-llama-core"
path = "../speech-server/tests/fixture/fake_llama.rs"
test = false
doc = false

# This crate is not part of any workspace (the application crate lives in src-tauri).
[workspace]
