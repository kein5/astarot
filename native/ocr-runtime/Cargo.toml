[package]
name = "astarot-ocr-runtime"
version = "0.1.0"
description = "Chat-bubble OCR and VRChat frame capture for VRCT-VOX (codename Humots)"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "astarot_ocr_runtime"

[[bin]]
name = "ocr-read"
path = "src/bin/ocr_read.rs"

[features]
default = ["download-binaries"]
# Link `ort`'s prebuilt ONNX Runtime statically (fetched at build time). The crate's own
# tests and `ocr-read` use it.
download-binaries = ["ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]
# Load the ONNX Runtime library at run time instead (native/onnx-runtime): `ORT_DYLIB_PATH`,
# else the library the app ships, else `onnxruntime.dll` / `libonnxruntime.so` by name. A
# missing library makes the engine unavailable instead of failing the build or the start of the
# process. The application core uses this (docs/voice-stack/core-integration.md, item 2).
load-dynamic = ["astarot-onnx-runtime/load-dynamic"]

[dependencies]
# The names the app goes by outside its code (ADR-014): the OpenVR library variable, the screen frame.
astarot-app-identity = { path = "../app-identity" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-17"] }
# The process's one ONNX Runtime library and environment, shared with local translation.
astarot-onnx-runtime = { path = "../onnx-runtime", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
# Only `ocr-read` writes JSON. The tests parse the reference floats exactly (below); the
# feature stays out of normal builds so that an application using this crate keeps its own
# float parsing.
serde_json = "1"
sha2 = "0.10"
caseless = "0.2"
thiserror = "2"
# python-bidi 0.6.11 (what RapidOCR reorders Arabic with) wraps this exact version.
unicode-bidi = "=0.3.15"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
libloading = "0.8"
astarot-openvr-client = { path = "../openvr-client" }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
# The process's one OpenVR connection, shared with the VR overlay.
astarot-openvr-client = { path = "../openvr-client" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"

# This crate is not part of any workspace (the application crate lives in src-tauri).
[workspace]
