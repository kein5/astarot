[package]
name = "astarot-speech-server"
version = "0.0.0"
description = "Owns the bundled speech.cpp server processes of ASTAROT: start, stop, restart and liveness (codename Sargatanas)"
edition = "2024"
publish = false

[dependencies]
# The host's environment for the programs it starts under the AppImage (#924, item 22).
astarot-app-identity = { path = "../app-identity" }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# A stand-in for the speech.cpp executable that the integration tests start. It is
# never part of an application build: a dependent crate does not build this target.
[[bin]]
name = "fake-speech"
path = "tests/fixture/fake_speech.rs"
test = false
doc = false

# A stand-in for llama.cpp's llama-server, for the same reason.
[[bin]]
name = "fake-llama"
path = "tests/fixture/fake_llama.rs"
test = false
doc = false
