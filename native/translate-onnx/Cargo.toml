[package]
name = "vrct-translate-onnx"
version = "0.0.0"
description = "Local translation for VRCT-VOX: M2M100 and NLLB-200 on ONNX Runtime, with their SentencePiece tokenizers"
edition = "2021"
publish = false

[lib]
name = "vrct_translate_onnx"

[[bin]]
name = "vrct-translate"
path = "src/bin/translate.rs"

[dependencies]
# The same ONNX Runtime binding, version and features as native/rvc-runtime (#275), so the
# two can share one runtime when they are brought together.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-17"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# SentencePiece's normalization and segmentation from tokenizer.json, in the release line of
# the Python `tokenizers` the app uses today (0.23.3). fancy-regex keeps it free of C code.
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

# One Windows build covers NVIDIA, AMD and Intel GPUs through DirectML; the CPU is the fallback.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[profile.dev]
# The integration tests run real models; unoptimized they take minutes.
opt-level = 2

[profile.release]
lto = "thin"

# Not part of any workspace (the application crate lives in src-tauri).
[workspace]
