[package]
name = "astarot-translate-onnx"
version = "0.0.0"
description = "Local translation for VRCT-VOX: M2M100 and NLLB-200 on ONNX Runtime, with their SentencePiece tokenizers"
edition = "2024"
publish = false

[lib]
name = "astarot_translate_onnx"

[[bin]]
name = "astarot-translate"
path = "src/bin/translate.rs"

[features]
default = ["load-dynamic"]
# Load the ONNX Runtime library at run time through native/onnx-runtime, the library and
# environment chat reading (native/ocr-runtime) uses in the app: `ORT_DYLIB_PATH`, else the
# library the app ships, else `onnxruntime.dll` / `libonnxruntime.so` by name. `ort` features
# are unified across the app, so this crate must not link ONNX Runtime there. A missing library
# is an error value (`translation_runtime_missing`).
load-dynamic = ["astarot-onnx-runtime/load-dynamic"]
# Link `ort`'s prebuilt ONNX Runtime instead (fetched at build time). Only for running the
# comparison command by hand: `--no-default-features --features download-binaries`.
download-binaries = ["ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]

[dependencies]
# The same ONNX Runtime binding and version as native/ocr-runtime and native/rvc-runtime. The
# execution provider features only add the Rust side of each provider (no linking with
# `load-dynamic`): whether one is there depends on the ONNX Runtime library that is loaded.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-17", "cuda", "tensorrt", "openvino", "migraphx", "webgpu"] }
# The process's one ONNX Runtime library and environment, shared with chat reading.
astarot-onnx-runtime = { path = "../onnx-runtime", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# SentencePiece's normalization and segmentation from tokenizer.json, in the release line of
# the Python `tokenizers` the app uses today (0.23.3). fancy-regex keeps it free of C code.
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

# DirectML (NVIDIA, AMD and Intel GPUs through DirectX 12) exists on Windows only.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[profile.dev]
# The integration tests run real models; unoptimized they take minutes.
opt-level = 2

[profile.release]
lto = "thin"

# Not part of any workspace (the application crate lives in src-tauri).
[workspace]
