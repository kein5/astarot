[package]
name = "vrct-voice-conversion"
version = "0.1.0"
description = "Direct voice, the voice conversion worker's owner and its runtime setup for VRCT-VOX"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "vrct_voice_conversion"

# Versions are pinned to the ones native/core and src-tauri already hold, so linking this
# crate into the app adds no second copy of any of them.
[dependencies]
# Raw deflate for the runtime's zip archives and gzip for its .tgz.
flate2 = "=1.1.11"
crc32fast = "=1.5.5"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# The runtime's .tgz archives (ONNX Runtime for Linux). Without xattr: only file data is read.
tar = { version = "=0.4.46", default-features = false }
uuid = { version = "=1.29.0", features = ["v4"] }
# Routes, capture and outputs; the PipeWire client is chosen by the application.
vrct-audio-routing = { path = "../audio-routing", default-features = false }
# The download transport and the root lease of the runtime setup.
vrct-ops = { path = "../ops" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "=3.27.0"

# This crate is not part of any workspace (the application crate lives in src-tauri).
[workspace]
