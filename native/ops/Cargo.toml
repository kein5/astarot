[package]
name = "vrct-ops"
version = "0.0.0"
description = "Model downloads, usage events and the backend watchdog of VRCT-VOX (codename Nebiros)"
edition = "2024"
publish = false

# Versions are pinned to the ones src-tauri/Cargo.lock already holds, so linking this crate into
# the app later adds no second copy of any of them.
[dependencies]
# The names the app goes by outside its code (ADR-014): the owner marker of a download.
app-identity = { path = "../app-identity" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
httparse = "=1.10.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
uuid = { version = "=1.29.0", features = ["v4"] }
webpki-roots = "=1.0.11"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "=3.27.0"

# A stand-in for the speech.cpp executable that the hardware tests start. It is never part
# of an application build: a dependent crate does not build this target.
[[bin]]
name = "fake-speech-devices"
path = "tests/fixture/fake_speech_devices.rs"
test = false
doc = false

# This crate is not part of any workspace (the application crate lives in src-tauri).
[workspace]
