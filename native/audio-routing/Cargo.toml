[package]
name = "vrct-audio-routing"
version = "0.1.0"
description = "Audio device enumeration, identity, default following and voice routing for VRCT-VOX"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "vrct_audio_routing"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
pipewire = "=0.10.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "=0.62.2"
