[package]
name = "vrct-audio-routing"
version = "0.1.0"
description = "Audio device enumeration, identity, default following and voice routing for VRCT-VOX"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "vrct_audio_routing"

[features]
default = ["pipewire"]
# Linux: the PipeWire client (needs the libpipewire-0.3 development files and libclang
# to build). Without it the Linux device lists are empty and nothing plays; the core's
# tests build that way so they need no PipeWire. No effect on other systems.
pipewire = ["dep:pipewire"]

[dependencies]
# The route's names, under the spelling written and the one read during 0.6.x (ADR-014, 2.8).
app-identity = { path = "../app-identity" }
serde_json = "=1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
# v0_3_49: a stream buffer says how many frames the cycle wants. Supported
# distributions (Ubuntu 24.04, Debian 13, Fedora 44) ship PipeWire 1.0 or later.
pipewire = { version = "=0.10.1", features = ["v0_3_49"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "=0.62.2"
