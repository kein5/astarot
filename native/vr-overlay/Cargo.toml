[package]
name = "vrct-vr-overlay"
version = "0.0.0"
description = "The SteamVR overlays of VRCT-VOX: the subtitle logs, the VR panel and its launcher"
edition = "2024"
publish = false

[lib]
name = "vrct_vr_overlay"

[dependencies]
# The names the app goes by outside its code (ADR-014): the OpenVR library variable, the panel frame.
app-identity = { path = "../app-identity" }
ab_glyph = "=0.2.32"
serde_json = "=1.0.154"
unicode-segmentation = "=1.13.3"
# The process's one OpenVR connection, shared with the OCR capture. openvr_api is loaded
# when SteamVR runs, not linked: the build needs no OpenVR SDK.
vrct-openvr-client = { path = "../openvr-client" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# This crate is not part of any workspace (the application crate lives in src-tauri).
[workspace]
