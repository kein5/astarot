[package]
name = "vrct-vox"
version = "0.0.0"
description = "ASTAROT: speech, voice conversion and translated chat"
authors = ["misyaguziya"]
edition = "2024"
# Never published: cargo-deny (deny.toml) treats it as this repository's own code.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tray-icon: the tray companion, an experimental feature that is off until the user turns it on.
# No `devtools`: a debug build has the web inspector anyway, and a release must not open it (#456).
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
font-kit = "=0.14.3"
# The backend core, run in this process (Issue #285; see src/backend_host.rs). On Linux,
# `pipewire` lists and watches the audio devices through libpipewire-0.3 (its development
# files and libclang are needed to build); it changes nothing on Windows. `onnx-translation`
# is the local translation on ONNX Runtime, loaded at run time like chat reading's (nothing is
# linked or fetched at build time; see docs/voice-stack/core-integration.md, decisions 1 and 2).
vrct-core = { path = "../native/core", features = ["pipewire", "onnx-translation"] }
# The names the app goes by outside its code (ADR-014): folders, the app ID, environment variables.
app-identity = { path = "../native/app-identity" }

[dev-dependencies]
# Already locked through tauri-plugin-opener, which matches its URL scope with it; the tests use
# the same matcher on the capability files.
glob = "=0.3.4"
# Already locked through tauri-plugin-updater; the tests decode the embedded public key.
base64 = "=0.23.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
# Already locked through tauri-plugin-updater: the beta channel reads the release list from the
# GitHub API with the same client, TLS provider and version parser (src/app_update.rs).
reqwest = { version = "=0.13.5", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
semver = "=1.0.28"

[target.'cfg(windows)'.dependencies]
# Already locked through wry: the app makes the WebView2 environment that every window shares,
# with WebView2's crash reports to Microsoft turned off (#564; see src/webview_environment.rs).
# The features are a subset of the ones wry turns on.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
# Already locked through tauri-plugin-opener; used for the GlobalShortcuts portal.
zbus = "=5.19.0"
gdkx11 = "=0.18.2"
# Already locked through wry; used to move the VR page off the desktop.
webkit2gtk = "=2.0.2"
