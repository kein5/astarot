# osv-scanner's exceptions (python tools/dev.py check --scope vulns; docs/development.md,
# "リポジトリの検査"). Decided on 2026-11-21 in #835: a notice that cannot be fixed now is listed
# here with its reason and the day to look at it again (ignoreUntil); any other notice fails the
# check. On that day the exception ends and the check fails until it is looked at again: fixed,
# or listed again with a new day and the reason it still holds.
#
# None of these has a release that fixes it by updating within the same major version. Each was
# checked on 2026-11-21 with `cargo tree -i` in the workspaces that hold it.

# chrono: unmaintained (alternatives: jiff, time). Since #879 no crate of this repository uses it:
# astarot-core and astarot-ops moved to jiff. It stays only in src-tauri/Cargo.lock, as an optional
# dependency of serde_with that the app does not turn on (`cargo tree -i chrono` prints nothing).
# Cargo keeps unused optional dependencies in a lock file, and osv-scanner reads the lock file.
# tests/devtools/test_lockfile_exceptions.py fails if chrono comes back into the build.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-21
reason = "chrono is only in src-tauri/Cargo.lock as an optional dependency of serde_with that the app does not build; no crate of this repository uses it since #879"

# ttf-parser: unmaintained (alternative: skrifa). It comes through ab_glyph, which draws the VR
# subtitles in astarot-vr-overlay; leaving it means changing how the subtitles are drawn.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2027-02-21
reason = "ttf-parser comes through ab_glyph (astarot-vr-overlay's subtitles); no ab_glyph release leaves it"

# zbus_names, zvariant, zvariant_derive: no longer separate crates; zbus 6 holds them. zbus 5
# comes from astarot-core's Secret Service code, from the Tauri app's own crate (astarot), and from
# tauri-plugin-opener and tauri-plugin-single-instance, so the app keeps them until those plugins
# move to zbus 6 too.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2027-02-21
reason = "zbus_names is part of zbus 6; zbus 5 comes from astarot-core, astarot and Tauri's opener and single-instance plugins"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-02-21
reason = "zvariant is part of zbus 6; zbus 5 comes from astarot-core, astarot and Tauri's opener and single-instance plugins"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2027-02-21
reason = "zvariant_derive is part of zbus 6; zbus 5 comes from astarot-core, astarot and Tauri's opener and single-instance plugins"

