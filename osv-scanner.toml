# glib 0.18 while Tauri builds on GTK 3.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-02-21
reason = "glib 0.18 comes through GTK 3 (the Tauri app on Linux), whose bindings end at 0.18; the fix is in glib 0.20"

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
