# Python packages of the developer tools and tests, resolved by uv into uv.lock. The app has no
# Python since 0.5.0, and the Python backend (src-python) went in 0.6.0 (#285).
#
#   uv sync --only-group voice-test     # model-free contract tests (tools/dev.py setup --scope headless)
#   uv sync --only-group voice-ui-test  # browser tests (tools/dev.py setup --scope browser)
#
# The version follows package.json; utils/update_version.py updates it and
# uv.lock together.
[project]
name = "astarot"
version = "0.7.0-beta.3"
description = "VRCT-VOX developer tools and tests"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "pytest==9.2.0",
]
# Model-free headless tests and Controller contracts with OS/model services
# injected; installed alone with --only-group.
voice-test = [
    "pytest==9.2.0",
    "PyYAML==6.0.3",
    "ruff==0.17.5",
    "numpy==2.5.4",
    "psutil==7.2.2",
    "pillow==13.0.0",
    "tqdm==4.70.1",
    # Verifies updater signatures in the release-draft tests (tools/updater_manifest.py).
    "cryptography==50.0.2",
    # The Quick Chat native GUI test reads what the app sends over OSC (tests/platform/test_native_quick_chat.py).
    "python-osc==1.10.2",
    # pyopenvr: the Rust crates' copy of its function tables is checked against it
    # (tests/voice/test_openvr_fn_tables.py), and the packages bundle the OpenVR client library
    # from this wheel (tools/runtime_libraries.py; its hash is held to uv.lock's).
    "openvr==2.12.1401",
]
# Optional browser/stdio fixtures, never bundled with VRCT-VOX.
voice-ui-test = [
    {include-group = "voice-test"},
    "playwright==1.65.2",
    "python-osc==1.10.2",
]

[tool.uv]
# The tools are not an installable package.
package = false
# Released platforms only: Windows x64 and Linux x86_64.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff.lint]
# Ruff 0.14's default rules, named so that a Ruff upgrade does not widen the check.
# Ruff 0.17 added hundreds of findings (import order, dict() calls...) under its new defaults.
select = ["E4", "E7", "E9", "F"]
