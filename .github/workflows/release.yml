# Build candidates only. Draft preparation is a separate manual workflow.
name: Validate VRCT-VOX distribution

on:
  workflow_dispatch:
  # Release pull requests build and inspect the Windows candidate too.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A stable release pull request carries its version's CHANGELOG.md section (tools/changelog.py write).
  changelog:
    name: CHANGELOG has this version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python tools/changelog.py check

  # The build job makes the one Windows package, ASTAROT.zip, and the NSIS installer, which has
  # the package's SHA-256 built in (tools/installer_package_hashes.py): the installer refuses a
  # package that was replaced on the release page, even with its .sha256.
  # The candidate job below inspects everything together and records the candidate.
  # Up to 0.5 a CUDA package (VRCT-VOX_cuda.zip) was built too; from 0.5.0 it held the same
  # files, and #288 dropped it. The installer reads its GPU choice (/EDITION=gpu) as this package.
  build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect ASTAROT.zip
        uses: ./.github/actions/windows-package
        with:
          script: release
          package: ASTAROT.zip

      - name: Inspect source archive without OCR weights
        shell: pwsh
        run: |
          git archive --format=zip --output=VRCT-VOX-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_voice_distribution.py --source-archive VRCT-VOX-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The installer from `npm run release` above has no hash built in. Bundle it again now
      # that the package exists; ASTAROT_REQUIRE_PACKAGE_HASHES stops the build without it.
      - name: Build the installer with the package hash
        shell: pwsh
        env:
          ASTAROT_REQUIRE_PACKAGE_HASHES: '1'
        run: |
          python tools/installer_package_hashes.py write --package ASTAROT.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Tauri CLI directly: through npm, pwsh runs npm.ps1 and drops the "--", so npm
          # takes --bundles as its own option and Tauri gets "bundle nsis".
          node node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect build outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-output | Out-Null
          Move-Item ASTAROT.zip build/windows-output/
          Move-Item "src-tauri/target/release/bundle/nsis/ASTAROT_$($env:VERSION)_x64-setup.exe" build/windows-output/
          Copy-Item src-tauri/nsis/package-hashes.nsh build/windows-output/

      - name: Hand over build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: build/windows-output/*

  candidate:
    name: Windows candidate (not a release)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    # id-token and attestations sign the build provenance of a manual candidate (second security
    # audit SEC-04). The step skips pull requests.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Keep the single-line GITHUB_ENV assignment and artifact paths bounded.
          if ($version -isnot [string] -or $version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') {
            throw 'package.json must contain a single version string such as 1.2.3 or 1.2.3-beta.1'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify candidate version numbers match
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Set every version field to $expected before building."
            exit 1
          }

      - name: Set up Python
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: python

      - name: Receive build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-build
          path: build/windows-output

      # The hash the build job built into the installer must be that of the package released
      # next to it.
      - name: Check the installer's built-in package hash
        shell: pwsh
        run: |
          python tools/installer_package_hashes.py check --package build/windows-output/ASTAROT.zip --include build/windows-output/package-hashes.nsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect the ZIP and the completed NSIS installer
        shell: pwsh
        run: |
          $installer = "build/windows-output/ASTAROT_$($env:VERSION)_x64-setup.exe"
          python tools/check_voice_distribution.py build/windows-output/ASTAROT.zip --nsis $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release names and candidate identity
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $installer = "build/windows-output/ASTAROT_$($env:VERSION)_x64-setup.exe"
          python tools/release_candidate.py stage build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT --asset build/windows-output/ASTAROT.zip --asset $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_candidate.py verify build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signed build provenance (GitHub Artifact Attestations, Sigstore) for every candidate file:
      # it names this workflow, the commit and the run. prepare-release.yml refuses files without it.
      - name: Attest the candidate files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release-candidate/*

      # No Hugging Face upload, telemetry secrets, GitHub Release or publication.
      # Download candidate artifacts from this workflow for Windows acceptance.
      - name: Preserve inspected candidates for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ASTAROT-windows-candidate
          if-no-files-found: error
          retention-days: 7
          path: build/release-candidate/*
