# Build candidates only. Draft preparation is a separate manual workflow.
name: Validate VRCT-VOX distribution

on:
  workflow_dispatch:
  # Release pull requests build and inspect the Windows candidate too.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A stable release pull request carries its version's CHANGELOG.md section (tools/changelog.py write).
  changelog:
    name: CHANGELOG has this version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python tools/changelog.py check

  # The CUDA package builds first. The CPU job then builds its package and the NSIS installer,
  # which has the SHA-256 of both packages built in (tools/installer_package_hashes.py): the
  # installer refuses a package that was replaced on the release page, even with its .sha256.
  # The candidate job below inspects everything together and records the candidate.
  # Since 0.5.0 both packages hold the same files (no Python, so no CUDA libraries); the CUDA
  # package stays so that the installer's GPU choice and older GPU installs keep a download
  # (decision 17 in docs/voice-stack/core-integration.md).
  build-cuda:
    name: Windows cuda build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and inspect VRCT-VOX_cuda.zip
        uses: ./.github/actions/windows-package
        with:
          variant: cuda
          script: release-cuda
          package: VRCT-VOX_cuda.zip

      - name: Collect build outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-output, build/cuda-hash | Out-Null
          $hash = (Get-FileHash -Algorithm SHA256 VRCT-VOX_cuda.zip).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii -Path build/cuda-hash/VRCT-VOX_cuda.zip.sha256 -Value $hash
          Move-Item VRCT-VOX_cuda.zip build/windows-output/

      - name: Hand over the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cuda-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: build/windows-output/*

      # Only the hash goes to the CPU job, which builds it into the installer.
      - name: Hand over the package hash
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cuda-hash
          if-no-files-found: error
          retention-days: 1
          path: build/cuda-hash/VRCT-VOX_cuda.zip.sha256

  build-cpu:
    name: Windows cpu build
    needs: build-cuda
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and inspect VRCT-VOX.zip
        uses: ./.github/actions/windows-package
        with:
          variant: cpu
          script: release
          package: VRCT-VOX.zip

      - name: Inspect source archive without OCR weights
        shell: pwsh
        run: |
          git archive --format=zip --output=VRCT-VOX-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_voice_distribution.py VRCT-VOX-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Receive the CUDA package hash
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-cuda-hash
          path: build/cuda-hash

      # The installer from `npm run release` above has no hashes built in. Bundle it again now
      # that both packages exist; VRCT_REQUIRE_PACKAGE_HASHES stops the build without them.
      - name: Build the installer with both package hashes
        shell: pwsh
        env:
          VRCT_REQUIRE_PACKAGE_HASHES: '1'
        run: |
          python tools/installer_package_hashes.py write --cpu VRCT-VOX.zip --gpu build/cuda-hash/VRCT-VOX_cuda.zip.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Tauri CLI directly: through npm, pwsh runs npm.ps1 and drops the "--", so npm
          # takes --bundles as its own option and Tauri gets "bundle nsis".
          node node_modules/@tauri-apps/cli/tauri.js bundle --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect build outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-output | Out-Null
          Move-Item VRCT-VOX.zip build/windows-output/
          Move-Item "src-tauri/target/release/bundle/nsis/VRCT-VOX_$($env:VERSION)_x64-setup.exe" build/windows-output/
          Copy-Item src-tauri/nsis/package-hashes.nsh build/windows-output/

      - name: Hand over build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cpu-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: build/windows-output/*

  candidate:
    name: Windows candidate (not a release)
    needs: [build-cuda, build-cpu]
    runs-on: windows-latest
    timeout-minutes: 30
    # id-token and attestations sign the build provenance of a manual candidate (second security
    # audit SEC-04). The step skips pull requests.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Keep the single-line GITHUB_ENV assignment and artifact paths bounded.
          if ($version -isnot [string] -or $version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') {
            throw 'package.json must contain a single version string such as 1.2.3 or 1.2.3-beta.1'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify candidate version numbers match
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match candidate version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Set every version field to $expected before building."
            exit 1
          }

      - name: Set up Python
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          install_args: python

      - name: Receive build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-*-build
          merge-multiple: true
          path: build/windows-output

      # The hashes the CPU job built into the installer must be those of the packages
      # released next to it.
      - name: Check the installer's built-in package hashes
        shell: pwsh
        run: |
          python tools/installer_package_hashes.py check --cpu build/windows-output/VRCT-VOX.zip --gpu build/windows-output/VRCT-VOX_cuda.zip --include build/windows-output/package-hashes.nsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect CPU and CUDA ZIPs and completed NSIS installer
        shell: pwsh
        run: |
          $installer = "build/windows-output/VRCT-VOX_$($env:VERSION)_x64-setup.exe"
          python tools/check_voice_distribution.py build/windows-output/VRCT-VOX.zip build/windows-output/VRCT-VOX_cuda.zip --nsis $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release names and candidate identity
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $installer = "build/windows-output/VRCT-VOX_$($env:VERSION)_x64-setup.exe"
          python tools/release_candidate.py stage build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT --asset build/windows-output/VRCT-VOX.zip --asset build/windows-output/VRCT-VOX_cuda.zip --asset $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_candidate.py verify build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signed build provenance (GitHub Artifact Attestations, Sigstore) for every candidate file:
      # it names this workflow, the commit and the run. prepare-release.yml refuses files without it.
      - name: Attest the candidate files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release-candidate/*

      # No Hugging Face upload, telemetry secrets, GitHub Release or publication.
      # Download candidate artifacts from this workflow for Windows acceptance.
      - name: Preserve inspected candidates for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-windows-candidate
          if-no-files-found: error
          retention-days: 7
          path: build/release-candidate/*
