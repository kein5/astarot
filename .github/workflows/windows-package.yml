# The full candidate build runs on pull requests into main. This catches a change to
# what the Windows package ships in _internal earlier, when the change is still small.
name: Windows package resources

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - 'mise.toml'
      - 'mise.lock'
      - 'bat/**'
      - 'tools/app_resources.py'
      - 'tools/check_voice_distribution.py'
      - 'tools/speechcpp_bundle.py'
      - 'tools/sudachi_dictionary.py'
      - 'tools/build_rvc_worker.py'
      - 'tools/rust_licenses.py'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bat\build.bat fetches the pinned speech.cpp, builds the RVC worker with Rust and stages
      # _internal with the Python tools; no Python is packaged.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: python rust
      - run: bat\build.bat
      - name: Inspect the shipped files
        shell: pwsh
        run: |
          python tools/check_voice_distribution.py src-tauri/bin/_internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/app_resources.py --platform windows check src-tauri/bin/_internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
