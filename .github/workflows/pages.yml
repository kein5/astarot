name: VRCT-VOX user documentation (GitHub Pages)
# Builds site/ on pull requests that touch it. Deploys to GitHub Pages from
# develop, on a push that touches site/ or by hand. Pages must be enabled once in
# the repository settings with "GitHub Actions" as the source.
on:
  pull_request:
    paths:
      - 'site/**'
      - 'tools/check_site_search.mjs'
      - 'tools/check_site_anchors.mjs'
      - 'tools/check_site_downloads.mjs'
      - 'tools/check_site_manual.mjs'
      - 'tools/site_tokens.mjs'
      - 'DESIGN.md'
      - '.github/workflows/pages.yml'
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  # Let a running deployment finish; only superseded PR builds are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node at the version in mise.toml and mise.lock.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: node
      # The colour tokens are what DESIGN.md and the light table make, and keep their hue, chroma
      # and contrast rules (no packages needed).
      - run: node tools/site_tokens.mjs --check
      - run: npm ci --ignore-scripts
        working-directory: site
      # Fails on dead links, dead images and links to missing headings (Rspress).
      - run: npm run build
        working-directory: site
      # Words in the middle of Japanese sentences can be found, with Rspress's own search code.
      - run: node tools/check_site_search.mjs site/dist
      # Every link to a #heading finds it, and the pages and headings opened from outside are built.
      - run: node tools/check_site_anchors.mjs site/dist
      # The download button reads past and expected release assets as it should (no network).
      - run: node tools/check_site_downloads.mjs
      # The retired manual's pages send readers to the guide pages, which are built in both languages.
      - run: node tools/check_site_manual.mjs site/dist
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    if: github.repository == 'kein5/astarot' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
