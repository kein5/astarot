name: diag 1073 secret store
# A temporary branch's workflow (Issue #1073): how often the tests of native/core/tests/secret_store.rs
# that use the PC's real OS store fail, set up as voice-tests.yml does it and with the proposed
# changes, with GNOME Keyring installed again right before each run as the CI step does it. Not to
# be merged.
on:
  push:
    branches: [diag/1073-secret-store]
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [current, fixed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/core
          save-if: false
      - run: cargo test --locked --manifest-path native/core/Cargo.toml --lib --test secret_store --no-run
      - run: |
          systemctl --user is-system-running || true
          loginctl list-sessions --no-legend || true
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-} XDG_SESSION_ID=${XDG_SESSION_ID:-}"
      - run: REINSTALL=1 bash tools/ci/diag_1073_linux.sh ${{ matrix.variant }} 40
