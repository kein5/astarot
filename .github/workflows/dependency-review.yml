name: Dependency review
# Blocks pull requests that add dependencies with known vulnerabilities
# (GitHub Advisory Database); results appear in the job summary.
on:
  pull_request:
  # Required on develop, so the merge queue needs a result for it too.
  merge_group:
permissions:
  contents: read
jobs:
  dependency-review:
    # The review action needs a pull request to compare with. In the merge queue the job is
    # skipped, which a required check counts as passed; the pull request ran it already.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # eslint's lint-only tree depends on minimatch below the fixed 11.x.
          fail-on-scopes: runtime
