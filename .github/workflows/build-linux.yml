name: VRCT-VOX Linux candidate (no publication)

on:
  # One candidate per architecture carries both pinned speech.cpp builds (CPU and Vulkan).
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'src-tauri/**'
      - 'src-ui/**'
      - 'locales/**'
      - '*.html'
      - 'vite.config.js'
      - 'native/**'
      - 'config/pipewire/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'package*.json'
      - 'packaging/appimage/**'
      - 'tools/**'
      - 'tests/**'
      - 'licenses/**'
      - 'docs/voice-stack/speechcpp-bundle-artifacts.json'
      - 'docs/voice-stack/appimage-tools.json'
      - 'docs/voice-stack/appimage.md'
      - 'docs/voice-stack/linux-build-pipeline.md'
      - 'docs/voice-stack/local-setup-linux.md'
      - 'docs/voice-stack/licensing.md'
      - 'LICENSE'
      - 'NOTICE.md'

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # id-token and attestations sign the build provenance of a manual candidate (second security
    # audit SEC-04). Pull requests from forks get read-only tokens, and the step skips PRs.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: '4'
      # The build and test tools run on the Python in mise.toml; uv never fetches its own.
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    # Caches (actions/cache, Swatinem/rust-cache and the like) may serve pull request runs only.
    # A manual run builds the release candidate, and it builds without them.
    steps:
      # The tar.gz, the AppDir and the AppImage together need more room than some runners have
      # free (one had 14 GB on 2026-11-01); drop preinstalled SDKs this job never uses. Removing
      # them takes one to three minutes, so it runs behind the next steps; the build waits for it.
      - name: Free runner disk space in the background
        run: |
          df -h /
          (
            status=0
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || status=$?
            echo "$status" > "$RUNNER_TEMP/free-disk.status.partial"
            mv "$RUNNER_TEMP/free-disk.status.partial" "$RUNNER_TEMP/free-disk.status"
          ) < /dev/null > "$RUNNER_TEMP/free-disk.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node, Rust, Python (for the build and test tools) and uv at the versions in mise.toml and mise.lock.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: node rust python uv
      - name: System build and runtime dependencies
        run: |
          # libclang-dev: the app's backend core binds libpipewire-0.3 (native/audio-routing).
          packages=(build-essential pkg-config binutils libwebkit2gtk-4.1-dev libssl-dev
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libclang-dev
            pipewire-bin libvulkan1 libglfw3 libportaudio2 libasound2-dev
            webkit2gtk-driver xvfb xauth x11-utils dbus-x11 fonts-noto-cjk
            desktop-file-utils libgtk-3-dev libgdk-pixbuf-2.0-dev glib-networking
            imagemagick xdotool meson ninja-build libsndfile1-dev libglib2.0-dev liblua5.4-dev rpm)
          # Runners hosted on AWS fetch from archive.ubuntu.com instead of their slow EC2 mirror.
          bash tools/ci/prefer_ubuntu_archive.sh
          # The runner's package mirror sometimes cannot be resolved for a while. Try again before failing the job.
          for attempt in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y "${packages[@]}" && break
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Prepare tested PipeWire API in an isolated prefix
        run: |
          bash tools/ci/setup_pipewire.sh "$RUNNER_TEMP/vrct-pipewire"
          cat "$RUNNER_TEMP/vrct-pipewire/environment" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vrct-pipewire/prefix/bin" >> "$GITHUB_PATH"
      # The build needs the room the first step frees. Ten minutes at most; on its own the removal
      # took 0.9 to 2.7 minutes.
      - name: Wait for the freed disk space
        run: |
          for _ in $(seq 600); do
            [ -f "$RUNNER_TEMP/free-disk.status" ] && break
            sleep 1
          done
          echo "Waited ${SECONDS} s for the removal."
          cat "$RUNNER_TEMP/free-disk.log"
          test "$(cat "$RUNNER_TEMP/free-disk.status")" = 0
          df -h /
      - name: Build isolated candidate with both pinned speech.cpp builds
        run: |
          python tools/build_linux.py \
            --download-speech \
            --appimage --download-appimage-tools \
            > linux-build.log 2>&1
      # The test tools only (pytest, requests), checked against uv.lock; no app dependencies.
      - name: Test environment
        run: python tools/dev.py setup --scope headless
      - name: Contracts and archive integrity
        run: |
          build/dev/headless-venv/bin/python -m pytest \
            -c tests/voice/pytest.ini tests/voice/test_linux_package.py \
            tests/voice/test_distribution_artifacts.py tests/voice/test_fork_distribution_identity.py \
            tests/voice/test_appimage.py -q
          cd build/linux/artifacts
          sha256sum -c ./*.tar.gz.sha256
          sha256sum -c ./*.AppImage.sha256
      # The app's own unit tests (src-tauri), which no other job runs: this job has the WebKitGTK
      # and the other system libraries the app builds against (#881). The build above works in a
      # workspace of its own, so the checkout's development _internal is staged from build/ first.
      - name: App unit tests (src-tauri)
        run: |
          python tools/dev.py setup --scope resources
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install pinned GUI test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Relocated read-only package acceptance
        env:
          ASTAROT_TEST_NATIVE_GUI: '1'
          ASTAROT_TEST_XVFB: '1'
          GDK_BACKEND: x11
        run: |
          export ASTAROT_TEST_DRIVER="$HOME/.cargo/bin/tauri-driver"
          # Assigned apart from export, so that a missing archive stops the step.
          ASTAROT_TEST_LINUX_ARCHIVE="$(realpath build/linux/artifacts/*.tar.gz)"
          export ASTAROT_TEST_LINUX_ARCHIVE
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            build/dev/headless-venv/bin/python -m pytest \
            -c tests/voice/pytest.ini tests/platform/test_linux_package.py -q \
            --basetemp=build/linux/acceptance > linux-acceptance.log 2>&1
      - name: AppImage extract-and-run acceptance
        env:
          ASTAROT_TEST_NATIVE_GUI: '1'
          ASTAROT_TEST_XVFB: '1'
          GDK_BACKEND: x11
        run: |
          export ASTAROT_TEST_DRIVER="$HOME/.cargo/bin/tauri-driver"
          # Assigned apart from export, so that a missing AppImage stops the step.
          ASTAROT_TEST_APPIMAGE="$(realpath build/linux/artifacts/*.AppImage)"
          export ASTAROT_TEST_APPIMAGE
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            build/dev/headless-venv/bin/python -m pytest \
            -c tests/voice/pytest.ini tests/platform/test_appimage.py -q \
            --basetemp=build/linux/appimage-acceptance > appimage-acceptance.log 2>&1
      # The same files as the tar.gz, installed under /opt/vrct-vox (tools/linux_packages.py).
      - name: Build deb and rpm packages
        run: python3 tools/linux_packages.py --candidate build/linux/candidate/VRCT-VOX --output-dir build/linux/artifacts
      # Clean images pinned by digest; each installs with its own package manager and only the
      # declared requirements.
      - name: Install the packages in clean Ubuntu, Debian and Fedora
        run: |
          for image in \
            ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5 \
            debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6; do
            docker run --rm -v "$PWD/build/linux/artifacts:/packages:ro" -v "$PWD/tools/ci:/ci:ro" "$image" \
              bash /ci/check_linux_package.sh /packages/"$(basename build/linux/artifacts/*.deb)"
          done
          docker run --rm -v "$PWD/build/linux/artifacts:/packages:ro" -v "$PWD/tools/ci:/ci:ro" \
            fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e \
            bash /ci/check_linux_package.sh /packages/"$(basename build/linux/artifacts/*.rpm)"
      - name: Record immutable candidate identity and hashes
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python tools/release_candidate.py stage build/linux/release-candidate --platform linux --commit "$CANDIDATE_COMMIT" \
            --asset build/linux/artifacts/*.AppImage --asset build/linux/artifacts/*.tar.gz \
            --asset build/linux/artifacts/*.deb --asset build/linux/artifacts/*.rpm
          python tools/release_candidate.py verify build/linux/release-candidate --platform linux --commit "$CANDIDATE_COMMIT"
      # Signed build provenance (GitHub Artifact Attestations, Sigstore) for every candidate file:
      # it names this workflow, the commit and the run. prepare-release.yml refuses files without it.
      - name: Attest the candidate files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/linux/release-candidate/*
      # Candidate storage only. No release creation, package registry, or secrets.
      - name: Store inspected candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VRCT-VOX-linux-x86_64-candidate
          path: build/linux/release-candidate/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Store diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VRCT-VOX-linux-build-logs
          retention-days: 7
          path: |
            linux-build.log
            linux-acceptance.log
            appimage-acceptance.log
            build/linux/acceptance/**/*.log
            build/linux/appimage-acceptance/**/*.log
            build/linux/appimage-acceptance/**/normal-window-*.png
            build/linux/appimage-acceptance/**/normal-window-metrics.json
