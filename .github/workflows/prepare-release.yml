name: Prepare verified VRCT-VOX release draft
on:
  workflow_dispatch:
    inputs:
      linux_run:
        description: Successful manual Linux candidate run ID at the current commit of this branch (main = stable, develop = beta)
        type: string
        required: true
      windows_run:
        description: Successful manual Windows candidate run ID at the same commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  draft:
    if: github.repository == 'kein5/VRCT-VOX' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      # Reads the candidates' build provenance (gh attestation verify).
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tags and history: a beta's notes list the commits since the previous release tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify origin, successful runs, commit, version, every asset hash and its signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUN: ${{ inputs.linux_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          python -m tools.prepare_release --linux-run "$LINUX_RUN" --windows-run "$WINDOWS_RUN" \
            --commit "$CANDIDATE_COMMIT" --branch "$RELEASE_BRANCH" --output build/release-draft
      # The in-app updater (issue #330) takes VRCT-VOX_setup.exe and the AppImage from this
      # release, checked against the public key in src-tauri/tauri.conf.json. Sign exactly the
      # files verified above, then write latest.json from the signatures.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
      # The pinned Tauri CLI from package-lock.json; no package install scripts run.
      - name: Install the Tauri CLI and the signature verifier
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get install -y --no-install-recommends python3-cryptography
      # The updater key is a second key, separate from any code signing. Its private key and the
      # password (empty when the key has none) are repository secrets; only this step sees them.
      - name: Sign the updater files and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; a release without updater signatures cannot update itself."
            exit 1
          fi
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          payload=build/release-draft/payload
          for file in "$payload/VRCT-VOX_setup.exe" "$payload"/*.AppImage; do
            # Bind each signature to this version: the app requires it (requireSignedVersion).
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$file" < /dev/null
          done
          # Verifies every signature with the app's key (python3-cryptography), then
          # moves them into latest.json.
          python3 -m tools.updater_manifest --payload "$payload" --version "$version" --require-verification
      - name: Install pinned commit parser
        run: cargo install cocogitto --version 7.0.0 --locked
      # A stable release's notes come from its CHANGELOG.md section; a beta's from its commits.
      - name: Require a stable version's CHANGELOG section and write the draft notes
        run: |
          python tools/changelog.py check
          python tools/changelog.py release-notes --output build/release-draft/notes.md
      - name: Create draft only; publication remains a maintainer action
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          from tools.prepare_release import release_channel, require_unused_tag
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          channel = release_channel(os.environ['RELEASE_BRANCH'], version)
          require_unused_tag(version)
          payload = pathlib.Path('build/release-draft/payload')
          command = ['gh', 'release', 'create', 'v' + version, '--repo', 'kein5/VRCT-VOX',
                     '--draft', '--target', os.environ['CANDIDATE_COMMIT'], '--title', 'VRCT-VOX ' + version,
                     '--notes-file', 'build/release-draft/notes.md']
          # Betas never become the repository's latest release.
          command += ['--prerelease', '--latest=false'] if channel == 'beta' else ['--latest']
          subprocess.run(command + [str(path) for path in sorted(payload.iterdir())], check=True)
          PY
