name: VRCT-VOX voice contracts (no models)
on:
  push:
  pull_request:
permissions:
  contents: read
# The toolchains come from mise.toml and mise.lock (jdx/mise-action). uv takes the Python mise
# installed and never fetches one of its own.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
jobs:
  headless:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Cocogitto too: the tooling scope runs tools/changelog.py against real commits.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          install_args: node python uv cocogitto
      - run: uv venv --python 3.11
      - run: uv export --frozen --no-header --no-annotate --format requirements-txt --no-emit-project --only-group voice-test --output-file voice-test-requirements.txt
      - run: uv pip sync --require-hashes voice-test-requirements.txt
      - if: runner.os == 'Linux'
        # The runner's package mirror sometimes cannot be resolved for a while. Try again before failing the job.
        run: |
          for attempt in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y pkg-config gcc g++ meson ninja-build libsndfile1-dev libglib2.0-dev liblua5.4-dev && break
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Prepare tested PipeWire API in an isolated prefix
        if: runner.os == 'Linux'
        run: |
          bash tools/ci/setup_pipewire.sh "$RUNNER_TEMP/vrct-pipewire"
          cat "$RUNNER_TEMP/vrct-pipewire/environment" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vrct-pipewire/prefix/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: uv run --no-project python tools/build_voice_gate.py
      - run: uv run --no-project python tools/dev.py check --scope tooling
      - run: uv run --no-project python tools/dev.py check --scope voice
      - run: uv run --no-project python tools/dev.py check --scope lint
      - run: uv run --no-project python tools/voice_cli.py --help
      - run: uv run --no-project python tools/voice_route.py --help
      - run: npm ci --ignore-scripts
      - run: uv run --no-project python tools/dev.py check --scope ui
  # The Rust backend core through the connection the UI uses (Issue #285): start-up and
  # shut-down, settings carried over from the Python backend, the error codes, and the request
  # rules. No model, device or network.
  core-integration:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/core
      - run: cargo test --locked --manifest-path native/core/Cargo.toml
  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          install_args: python uv
      - run: uv sync --frozen
      - run: uv run --no-project python tools/dev.py check --scope backend --python .venv/Scripts/python.exe
      # mainloop sends faulthandler to this file, so a native crash prints nothing to the job log.
      - name: Show the native crash trace
        if: failure()
        shell: pwsh
        run: if (Test-Path crash_trace.log) { Get-Content crash_trace.log -Tail 200 }
  # Parts of this suite run only on Linux (the PipeWire graph tests), so the Windows job alone does not cover it.
  backend-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          install_args: python uv
      - run: uv run --no-project --python 3.11 python tools/dev.py setup --scope backend
      - run: uv run --no-project --python 3.11 python tools/dev.py check --scope backend
      - name: Show the native crash trace
        if: failure()
        run: if [ -f crash_trace.log ]; then tail -n 200 crash_trace.log; fi
  # Pull requests, and pushes to develop and main that did not come through one, so commits
  # made without the local commit-msg hook are checked too.
  commit-conventions:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned commit validator
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.8
          install_args: cocogitto
      - name: Check new commits only
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$COMMIT_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "A new branch has no earlier commit to compare with; its pull request is checked instead."
            exit 0
          fi
          python tools/dev.py check --scope commits --base "$COMMIT_BASE"
