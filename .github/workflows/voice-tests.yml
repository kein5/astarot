name: VRCT-VOX voice contracts (no models)
on:
  # Pushes run the jobs on develop and main only. A push to a pull request's branch would run the
  # same commit a second time (Issue #773). develop's runs keep the Rust caches that pull requests
  # read and the history pipeline-latency.yml sends to Bencher.
  push:
    branches: [develop, main]
  pull_request:
  # The merge queue checks the commit it builds with the same jobs before it merges.
  merge_group:
  # A branch without a pull request runs the jobs by hand.
  workflow_dispatch:
permissions:
  contents: read
# The toolchains come from mise.toml and mise.lock (jdx/mise-action). uv takes the Python mise
# installed and never fetches one of its own.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
jobs:
  # Temporary check for Issue #861 (never merged): the fixed tests, run whole and repeatedly on
  # Windows, in six jobs so that six of the runs meet the fonts cold.
  core-integration:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        job: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/core
            native/translation
            native/translate-onnx
            native/tts
      - run: cargo test --locked --manifest-path native/core/Cargo.toml --test realtime_asr --test vr_overlay --test voice --no-run
      - name: The three test binaries, whole, 5 times each
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 5); do
            for t in realtime_asr vr_overlay voice; do
              if cargo test --locked --manifest-path native/core/Cargo.toml --test $t > out.log 2>&1; then
                echo "run $i $t: $(grep -E '^test result' out.log)"
              else
                failed=$((failed + 1))
                echo "run $i $t: FAILED"
                grep -E -A1 "^test .* FAILED|panicked" out.log | head -12
              fi
            done
          done
          echo "failed runs: $failed"
          test "$failed" = 0
