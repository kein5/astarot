name: VRCT-VOX voice contracts (no models)
on:
  push:
  pull_request:
  # The merge queue checks the commit it builds with the same jobs before it merges.
  merge_group:
permissions:
  contents: read
# The toolchains come from mise.toml and mise.lock (jdx/mise-action). uv takes the Python mise
# installed and never fetches one of its own.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
jobs:
  # The developer tools, the release and distribution checks and the UI (Python and Node), and on
  # Linux the native helpers on a private PipeWire graph. The Python backend's own jobs
  # (backend-windows, backend-linux) went with it in 0.6.0 (#285); the core is core-integration's.
  headless:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cocogitto too: the tooling scope runs tools/changelog.py against real commits. Rust on
      # Linux: the voice gate helper's test on a private PipeWire graph (below).
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: ${{ runner.os == 'Linux' && 'node python uv cocogitto rust' || 'node python uv cocogitto' }}
      - run: uv venv
      - run: uv export --frozen --no-header --no-annotate --format requirements-txt --no-emit-project --only-group voice-test --output-file voice-test-requirements.txt
      - run: uv pip sync --require-hashes voice-test-requirements.txt
      - if: runner.os == 'Linux'
        # The runner's package mirror sometimes cannot be resolved for a while. Try again before failing the job.
        run: |
          for attempt in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y pkg-config gcc g++ meson ninja-build libsndfile1-dev libglib2.0-dev liblua5.4-dev libclang-dev && break
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Prepare tested PipeWire API in an isolated prefix
        if: runner.os == 'Linux'
        run: |
          bash tools/ci/setup_pipewire.sh "$RUNNER_TEMP/vrct-pipewire"
          cat "$RUNNER_TEMP/vrct-pipewire/environment" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vrct-pipewire/prefix/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: uv run --no-project python tools/build_voice_gate.py
      # On a PipeWire and WirePlumber of their own: the real vrct-voice-gate refuses what it was
      # not given (decision 89) and, heard through the managed microphone, keeps speech audible
      # while it suppresses the direct voice; a conversion on the managed route captures its
      # microphone and plays into the managed VC input (decision 11;
      # docs/voice-stack/core-integration.md).
      # libclang: the crate binds libpipewire-0.3.
      - name: Voice gate helper and managed conversion devices on a private PipeWire graph
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path native/audio-routing/Cargo.toml --test voice_gate_private --test managed_vc_private --test direct_suppression_private -- --ignored
      - run: uv run --no-project python tools/dev.py check --scope tooling
      - run: uv run --no-project python tools/dev.py check --scope voice
      - run: uv run --no-project python tools/dev.py check --scope lint
      # Realtime recognition reads a microphone and a speaker's monitor through the PipeWire
      # capture of vrct-audio-routing (decision 2 of #733), on a private graph.
      - name: Realtime recognition's capture on a private PipeWire graph
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path native/transcription/Cargo.toml --features pipewire --test pipewire_capture_private -- --ignored
      - run: npm ci --ignore-scripts
      - run: uv run --no-project python tools/dev.py check --scope ui
  # The Rust backend core through the connection the UI uses (Issue #285): start-up and
  # shut-down, settings carried over from the Python backend, the error codes, and the request
  # rules. No model, device or network.
  core-integration:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/core
            native/translation
            native/translate-onnx
            native/tts
      # The names the app goes by outside its code, and the VRCT-VOX ones they replace (ADR-014).
      - run: cargo test --locked --manifest-path native/app-identity/Cargo.toml
      - run: cargo test --locked --manifest-path native/core/Cargo.toml
      # The time the voice pipeline adds of its own, on stand-ins for the engines (#738;
      # docs/voice-stack/pipeline-latency-tracking.md). A measurement: its result never fails the
      # job. pipeline-latency.yml sends it to Bencher once this workflow has finished.
      - name: Measure the pipeline's own time
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VRCT_PIPELINE_BMF: ${{ runner.temp }}/pipeline-latency.json
        run: cargo test --locked --manifest-path native/core/Cargo.toml --test pipeline_overhead -- --ignored --nocapture
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-latency-${{ matrix.os }}
          path: ${{ runner.temp }}/pipeline-latency.json
          if-no-files-found: ignore
          retention-days: 14
      # The OS stores the API keys go to (ADR-013). Linux: GNOME Keyring with an unlocked login
      # keyring on a private session bus. Windows: the runner user's Credential Manager. Each test
      # writes one item under a scope of its own and removes it. On the same bus, the move of the
      # 0.5.x folders looks for a running app by its single-instance name (ADR-014).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          dbus-run-session -- bash -c 'printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --locked --manifest-path native/core/Cargo.toml --lib secret_service -- --ignored && cargo test --locked --manifest-path native/core/Cargo.toml --test secret_store -- --ignored && cargo test --locked --manifest-path native/core/Cargo.toml --test storage_linux -- --ignored'
      - if: runner.os == 'Windows'
        run: |
          cargo test --locked --manifest-path native/core/Cargo.toml --lib credential_manager -- --ignored
          cargo test --locked --manifest-path native/core/Cargo.toml --test secret_store -- --ignored
      - run: cargo test --locked --manifest-path native/openvr-client/Cargo.toml
      # The ONNX Runtime library and environment chat reading, translation and the RVC worker share.
      - run: cargo test --locked --manifest-path native/onnx-runtime/Cargo.toml
      - run: cargo test --locked --manifest-path native/vr-overlay/Cargo.toml
      - run: cargo test --locked --manifest-path native/transcription/Cargo.toml
      - run: cargo test --locked --manifest-path native/voice-conversion/Cargo.toml
      # The translation providers and the readings, held to the contract recorded from the Python
      # clients (native/translation/tests/contract/), and the local translation without a model.
      - run: cargo test --locked --manifest-path native/translation/Cargo.toml
      - run: cargo test --locked --manifest-path native/translate-onnx/Cargo.toml
      # Speech requests, the speech queue and the listener monitor (Issue #279).
      - run: cargo test --locked --manifest-path native/tts/Cargo.toml
  # Pull requests, and pushes to develop and main that did not come through one, so commits
  # made without the local commit-msg hook are checked too.
  commit-conventions:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned commit validator
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: cocogitto
      - name: Check new commits only
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$COMMIT_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "A new branch has no earlier commit to compare with; its pull request is checked instead."
            exit 0
          fi
          python tools/dev.py check --scope commits --base "$COMMIT_BASE"
