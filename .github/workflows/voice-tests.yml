name: VRCT-VOX voice contracts (no models)
on:
  # Pushes run the jobs on develop and main only. A push to a pull request's branch would run the
  # same commit a second time (Issue #773). develop's runs keep the Rust caches that pull requests
  # read and the history pipeline-latency.yml sends to Bencher.
  push:
    branches: [develop, main]
  pull_request:
  # The merge queue checks the commit it builds with the same jobs before it merges.
  merge_group:
  # A branch without a pull request runs the jobs by hand.
  workflow_dispatch:
permissions:
  contents: read
# The toolchains come from mise.toml and mise.lock (jdx/mise-action). uv takes the Python mise
# installed and never fetches one of its own.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
jobs:
  # Temporary diagnostic run for Issue #861 (never merged): the Windows core tests that wait a
  # fixed time, run whole and repeatedly, with timings of the font index, the caption drawing,
  # the overlay upload and the realtime read loop.
  core-integration:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/core
            native/translation
            native/translate-onnx
            native/tts
      - run: cargo test --locked --manifest-path native/core/Cargo.toml --test realtime_asr --test voice --no-run
      - name: Fonts on this runner
        shell: bash
        run: |
          ls "$WINDIR/Fonts" | wc -l
          ls "$WINDIR/Fonts" | grep -iE "yu|meiryo|msgothic|msmincho|malgun|yahei|simsun|jhenghei|segoeui|noto" || true
      - name: realtime_asr, whole binary, 10 times
        shell: bash
        run: |
          for i in $(seq 1 10); do
            echo "=== run $i"
            cargo test --locked --manifest-path native/core/Cargo.toml --test realtime_asr -- --nocapture > rt.log 2>&1 || true
            grep -E "\[861\]|^test result|FAILED|panicked" rt.log | grep -vE "update_image: lock 0 ms, set_raw 0 ms" || true
          done
      - name: voice, whole binary, 10 times
        shell: bash
        run: |
          for i in $(seq 1 10); do
            echo "=== run $i"
            cargo test --locked --manifest-path native/core/Cargo.toml --test voice -- --nocapture > vo.log 2>&1 || true
            grep -E "\[861\] eventually|\[861\] wait_from|^test result|FAILED|panicked" vo.log || true
          done
