# One Windows package for release.yml: check the version fields, set up the toolchains, build
# the package with its npm script, inspect it and self-check the packaged backend. The calling
# job checks out the code first and collects the outputs afterwards.
name: Build a Windows package
description: Build and inspect VRCT-VOX.zip or VRCT-VOX_cuda.zip
inputs:
  variant:
    description: cpu or cuda
    required: true
  script:
    description: npm script that builds the package (release or release-cuda)
    required: true
  package:
    description: the ZIP the script writes
    required: true
runs:
  using: composite
  steps:
    - name: Read candidate version
      shell: pwsh
      run: |
        $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
        # Keep the single-line GITHUB_ENV assignment and artifact paths bounded.
        if ($version -isnot [string] -or $version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') {
          throw 'package.json must contain a single version string such as 1.2.3 or 1.2.3-beta.1'
        }
        "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify candidate version numbers match
      shell: pwsh
      run: |
        $expected = $env:VERSION
        $failed = $false

        $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
        if ($pkgVersion -ne $expected) {
          Write-Host "::error::package.json version ($pkgVersion) does not match candidate version ($expected)"
          $failed = $true
        }

        $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
        if ($tauriVersion -ne $expected) {
          Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match candidate version ($expected)"
          $failed = $true
        }

        $configContent = Get-Content src-python/config.py -Raw
        if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
          Write-Host "::error::could not find self._VERSION in src-python/config.py"
          $failed = $true
        } elseif ($Matches[1] -ne $expected) {
          Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match candidate version ($expected)"
          $failed = $true
        }

        if ($failed) {
          Write-Host "::error::Version mismatch detected. Set every version field to $expected before building."
          exit 1
        }

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.15.0'

    - name: Set up uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        version: '0.13.5'

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    # Both variants compile the same Tauri app; only the CPU job saves.
    - name: Cache Rust build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri -> target
        shared-key: windows-tauri
        save-if: ${{ inputs.variant == 'cpu' }}

    - name: Install dependencies
      shell: pwsh
      run: npm ci

    - name: Setup Python environments
      shell: pwsh
      run: npm run setup-python

    - name: Install packaging helper
      shell: pwsh
      run: uv pip install --system tqdm

    - name: Build and package ${{ inputs.package }}
      shell: pwsh
      env:
        SCRIPT: ${{ inputs.script }}
      run: npm run $env:SCRIPT

    - name: Inspect the package and its backend
      shell: pwsh
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        python tools/check_voice_distribution.py $env:PACKAGE src-tauri/bin/_internal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Starts the packaged backend itself: can it import what a feature imports only
    # when it turns on? (windows-package.yml says why.)
    - name: Self-check the packaged backend
      shell: pwsh
      run: |
        & src-tauri/bin/vrct-vox-sidecar-x86_64-pc-windows-msvc.exe --self-check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
